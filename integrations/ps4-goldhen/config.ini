# Sugeng Rawuh Billing & POS — PS4 GoldHEN Plugin Configuration
# Place this file in /data/GoldHEN/plugins/sugengrawuh/config.ini on PS4 internal HDD

[server]
# IP and Port of your Sugeng Rawuh Laravel Billing Host
server_url = http://192.168.1.100:8000

# Device authentication token obtained from Hardware Registry (/admin/hardware/registry)
device_token = YOUR_DEVICE_TOKEN_HERE

# Interval in seconds to poll for new billing popup alerts (default 3 seconds)
poll_interval = 3

# Interval in seconds to send keepalive heartbeat (default 30 seconds)
heartbeat_interval = 30
