name: Build Sugeng Rawuh Windows Installer (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-offline-images:
    name: Build linux/amd64 Docker Images & Offline Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 for Pre-Package Verification
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, sockets, gd, intl, zip, bcmath
          coverage: none

      - name: Run Deployment & Unit Verification Suite
        run: php vendor/phpunit/phpunit/phpunit --testsuite=Unit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sugeng-rawuh-app:1.0.0 (linux/amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag sugeng-rawuh-app:1.0.0 \
            --load \
            .

      - name: Pull Runtime Base Images (mysql:8.0 & nginx:1.26-alpine for linux/amd64)
        run: |
          docker pull --platform linux/amd64 mysql:8.0
          docker pull --platform linux/amd64 nginx:1.26-alpine

      - name: Export Offline Docker Image Archive & SHA256SUMS
        run: |
          mkdir -p offline-bundle/images
          docker save sugeng-rawuh-app:1.0.0 mysql:8.0 nginx:1.26-alpine | gzip -c > offline-bundle/images/sugeng-rawuh-images-amd64.tar.gz
          cd offline-bundle
          sha256sum images/sugeng-rawuh-images-amd64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Offline Docker Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sugeng-rawuh-offline-docker-bundle
          path: offline-bundle/
          retention-days: 7

  compile-windows-installer:
    name: Compile Inno Setup Installer (SugengRawuh-Setup-v1.0.0.exe)
    needs: build-offline-images
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Offline Docker Bundle Artifact
        uses: actions/download-artifact@v4
        with:
          name: sugeng-rawuh-offline-docker-bundle
          path: offline-bundle

      - name: Validate PowerShell Installer Scripts Syntax
        shell: powershell
        run: |
          $errors = $null
          Get-ChildItem -Path "installer\scripts\*.ps1" | ForEach-Object {
            Write-Host "Checking syntax: $($_.FullName)"
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "PowerShell syntax error in $($_.Name): $($parseErrors | Out-String)"
            }
          }

      - name: Compile SugengRawuh.iss with Inno Setup 6 (ISCC)
        shell: powershell
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            choco install innosetup --yes --no-progress
          }
          & $isccPath "installer\SugengRawuh.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC compilation failed with exit code $LASTEXITCODE"
          }

      - name: Generate Installer SHA-256 Checksum
        shell: powershell
        run: |
          $exePath = "dist\SugengRawuh-Setup-v1.0.0.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected output $exePath not found!"
          }
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SugengRawuh-Setup-v1.0.0.exe" | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ASCII
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload Windows Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SugengRawuh-Setup-v1.0.0
          path: |
            dist/SugengRawuh-Setup-v1.0.0.exe
            dist/SHA256SUMS.txt
          retention-days: 30

